name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン (例: 1.4.0)'
        required: true
        type: string

permissions:
  contents: write  # Release の作成に必要

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 直前のタグを引くために全履歴とタグを取得する。既定 (fetch-depth: 1) では
          # タグが手元に無く、Full Changelog の比較リンクを組み立てられない
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # タグ名 (v1.4.0) または手動入力からバージョン (1.4.0) を決定する
      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "バージョンの書式が不正です: '$version' (期待する形式: 1.4.0)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # ポータブル版 2 種 (ランタイム同梱 / 軽量) を artifacts へ出力する
      - name: Publish portable builds
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # publish.ps1 が出力した artifacts/publish (同梱版) を取り込む
      - name: Build installer
        shell: pwsh
        run: |
          # choco 版はマシン全体 (Program Files) へ入るが、インストーラの仕様変更で
          # 位置が変わっても切り分けできるよう、候補を順に探して明示的に失敗させる
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "::error::ISCC.exe が見つかりません。探索したパス:"
            $candidates | ForEach-Object { Write-Host "::error::  $_" }
            exit 1
          }
          Write-Host "ISCC: $iscc"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\SnapTack.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem artifacts -File | Select-Object Name, Length

      # docs/release-notes-vX.Y.Z.md をリリース本文にする。
      # 自動生成 (generate_release_notes) は使わない: PR 名は開発都合の文言で
      # 利用者向けではなく、機能単位で書いたノートと内容が二重になるため。
      # 差分を追う導線として Full Changelog のリンクだけは末尾に添える。
      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $notesPath = "docs/release-notes-v$version.md"
          if (-not (Test-Path $notesPath)) {
            # 黙って自動生成へ倒すと、消したはずの PR 一覧が復活して気付きにくい。
            # ノートの用意漏れはここで明示的に失敗させる
            Write-Host "::error::リリースノートが見つかりません: $notesPath"
            Write-Host "::error::docs/release-notes-v$version.md を作成してからタグを push してください。"
            exit 1
          }

          # 直前のタグとの比較リンクを添える。初回リリース (直前タグ無し) では省く
          $previous = git tag --list 'v*' --sort=-v:refname |
            Where-Object { $_ -ne "v$version" } |
            Select-Object -First 1

          $body = Get-Content $notesPath -Raw
          if ($previous) {
            $compare = "${{ github.server_url }}/${{ github.repository }}/compare/$previous...v$version"
            $body += "`n`n---`n`n**Full Changelog**: $compare`n"
            Write-Host "Full Changelog: $previous...v$version"
          } else {
            Write-Host "直前のタグが無いため Full Changelog は付けません。"
          }

          $outPath = Join-Path $env:RUNNER_TEMP 'release-body.md'
          Set-Content -Path $outPath -Value $body -Encoding utf8NoBOM
          "path=$outPath" >> $env:GITHUB_OUTPUT

      # ドラフトとして作成する。内容を確認してから手動で公開する
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          draft: true
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            artifacts/*.zip
            artifacts/*setup.exe
